<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nikhil Guggilla | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #EBE4FC;
      --bg-dark: #1F0940;
      --primary: #7E3AF2;
      --text-dark: #111827;
      --text-muted: #6B7280;
      --white: #FFFFFF;
      --border-radius: 20px;
    }

    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: 'Poppins', sans-serif; background-color: var(--bg-light); color: var(--text-dark); overflow-x: hidden; }

    /* Navbar */
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background-color: var(--bg-light); position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-weight: 900; font-size: 1.5rem; color: var(--text-dark); text-decoration: none; }
    .nav-links a { margin-left: 30px; text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; transition: color 0.3s; }
    .nav-links a:hover { color: var(--primary); }

    /* Hero Section */
    .hero { position: relative; min-height: 90vh; display: flex; justify-content: center; align-items: center; padding: 50px; overflow: hidden; }
    .hero-content { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1200px; gap: 30px; }
    .hero-left, .hero-right { display: flex; flex-direction: column; gap: 25px; flex: 1; }
    .hero-center { flex: 1.5; display: flex; flex-direction: column; align-items: center; }
    .hero-center img { width: 100%; max-width: 450px; height: 550px; object-fit: cover; border-radius: 200px 200px 20px 20px; box-shadow: 0 20px 50px rgba(126, 58, 242, 0.2); }

    /* Marquee Fix */
    .marquee-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      overflow: hidden;
      background: var(--bg-light);
      padding: 20px 0;
      z-index: 5;
    }
    .marquee-content {
      display: flex;
      gap: 50px;
      width: max-content;
      animation: scroll 20s linear infinite;
    }
    .pill { background: var(--white); padding: 10px 25px; border-radius: 30px; font-weight: 600; color: var(--text-muted); white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    
    @keyframes scroll {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }

    /* Cards */
    .card { background: var(--white); padding: 30px; border-radius: var(--border-radius); box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
    .badge { display: inline-block; padding: 6px 15px; background: rgba(126, 58, 242, 0.1); color: var(--primary); border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 15px; }
    .mini-profile { display: flex; align-items: center; gap: 15px; padding: 15px 25px; background: var(--white); border-radius: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); width: fit-content; }
    .skills-box { background: var(--bg-dark); color: var(--white); border-radius: var(--border-radius); padding: 25px; }
    .skill-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; font-weight: 600; }
    
    /* Footer/Floating */
    .floating-resume { position: fixed; bottom: 30px; right: 30px; background: var(--bg-dark); color: var(--white); padding: 15px 30px; border-radius: 50px; text-decoration: none; font-weight: 600; z-index: 1000; }
  </style>
</head>
