<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nikhil Guggilla | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #EBE4FC;
      --bg-dark: #1F0940;
      --primary: #7E3AF2;
      --text-dark: #111827;
      --text-muted: #6B7280;
      --white: #FFFFFF;
      --border-radius: 20px;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    /* Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background-color: var(--bg-light);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo { font-weight: 900; font-size: 1.5rem; color: var(--text-dark); text-decoration: none; }
    .nav-links a { margin-left: 30px; text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; transition: color 0.3s; }
    .nav-links a:hover { color: var(--primary); }

    /* Hero Section */
    .hero {
      position: relative;
      min-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px;
      overflow: hidden;
    }

    .hero-bg-text {
      position: absolute;
      font-size: 14vw;
      font-weight: 900;
      color: rgba(31, 9, 64, 0.04);
      white-space: nowrap;
      z-index: 0;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      line-height: 0.8;
      text-align: center;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1200px;
      gap: 30px;
    }

    .hero-left, .hero-right {
      display: flex;
      flex-direction: column;
      gap: 25px;
      flex: 1;
    }

    .hero-center {
      flex: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      width: 100%;
    }

    .hero-center img {
      width: 100%;
      max-width: 450px;
      height: 550px;
      object-fit: cover;
      border-radius: 200px 200px 20px 20px;
      box-shadow: 0 20px 50px rgba(126, 58, 242, 0.2);
      z-index: 2;
    }

    /* Updated Marquee Styles */
    .marquee-container {
      width: 100vw;
      overflow: hidden;
      position: absolute;
      bottom: -40px; 
      left: 0;
      z-index: 5;
      background: var(--bg-light);
      padding: 10px 0;
      white-space: nowrap;
      -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
      mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
    }

    .marquee-content {
      display: inline-flex;
      gap: 30px;
      animation: scroll 25s linear infinite;
    }

    .marquee-content .pill {
      background: var(--white);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes scroll {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }

    .card {
      background: var(--white);
      padding: 30px;
      border-radius: var(--border-radius);
      box-shadow: 0 10px 40px rgba(0,0,0,0.04);
      position: relative;
    }

    .badge {
      display: inline-block;
      padding: 6px 15px;
      background: rgba(126, 58, 242, 0.1);
      color: var(--primary);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .mini-profile {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 25px;
      background: var(--white);
      border-radius: 50px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.04);
      width: fit-content;
    }
    .mini-profile img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .mini-profile h4 { margin: 0; font-size: 0.9rem; color: var(--text-dark); }
    .mini-profile p { margin: 0; font-size: 0.75rem; color: var(--text-muted); }

    .skills-box {
      background: var(--bg-dark);
      color: var(--white);
      border-radius: var(--border-radius);
      padding: 25px;
    }
    .skills-box h4 { margin: 0 0 15px 0; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    .skill-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .floating-resume {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--bg-dark);
      color: var(--white);
      padding: 15px 30px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 1000;
      transition: transform 0.3s;
    }
    .floating-resume:hover { transform: translateY(-5px); }

    /* Other Sections */
    .section-title { font-size: 3rem; font-weight: 900; margin-bottom: 40px; }
    .section-subtitle { font-size: 1rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
    
    .about-section { background-color: var(--bg-dark); color: var(--white); padding: 150px 50px 100px; display: flex; justify-content: center; }
    .about-container { max-width: 1200px; display: flex; gap: 50px; }
    .about-stats { flex: 1; display: flex; flex-direction: column; gap: 15px; }
    .stat-card { background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: var(--border-radius); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 20px; }
    .stat-card h3 { font-size: 2.5rem; color: var(--primary); margin: 0; }
    .about-text { flex: 1; }
    .about-text h2 { font-size: 4rem; font-weight: 900; line-height: 1.1; margin: 0 0 20px 0; }
    .about-text p { color: #A78BFA; font-size: 1.1rem; line-height: 1.8; }

    .skills-section { padding: 100px 50px; max-width: 1200px; margin: 0 auto; }
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .skill-card { background: var(--white); padding: 30px; border-radius: var(--border-radius); transition: transform 0.3s; }
    .skill-card.primary { background: var(--primary); color: var(--white); }
    .skill-icon { font-size: 2.5rem; margin-bottom: 15px; }

    .experience-section { padding: 100px 50px; max-width: 1200px; margin: 0 auto; }
    .job-card { background: var(--white); padding: 40px; border-radius: var(--border-radius); margin-bottom: 20px; display: grid; grid-template-columns: 80px 1fr 150px; gap: 20px; }
    .job-number { font-size: 2.5rem; font-weight: 900; color: var(--bg-light); }
    .job-details h4 { font-size: 1.3rem; margin: 0 0 5px 0; }
    .job-details .company { color: var(--primary); font-weight: 600; font-size: 0.9rem; margin-bottom: 15px; }

    .education-section { background-color: var(--bg-dark); color: var(--white); padding: 100px 50px; }
    .edu-container { max-width: 1200px; margin: 0 auto; }
    .edu-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: var(--border-radius); margin-bottom: 20px; }

    .contact-section { padding: 100px 50px; max-width: 1200px; margin: 0 auto; display: flex; gap: 50px; }
    .contact-info { flex: 1; }
    .contact-info h2 { font-size: 4rem; font-weight: 900; color: var(--primary); line-height: 1.1; margin-bottom: 20px; }
    .contact-pill { display: flex; align-items: center; gap: 15px; background: var(--white); padding: 15px 25px; border-radius: 50px; margin-bottom: 15px; font-weight: 600; color: var(--text-muted); text-decoration: none; width: fit-content; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
    .contact-form { flex: 1; background: var(--white); padding: 40px; border-radius: var(--border-radius); }
    .form-group { margin-bottom: 20px; }
